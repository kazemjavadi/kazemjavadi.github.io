    *, *::before, *::after {

    html, body {

    .container {

    .sidebar {
      width: 250px;
      flex-shrink: 0;
      position: fixed;
      top: 20px;

      background-color: #0D7C66;
      color: #edede9;

      margin-top: 0;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .sidebar ul {
      list-style-type: none;
      padding: 0;
    }

    .sidebar ul li {
      margin: 15px 0;
    }

    .sidebar ul > li > a {
      color: #edede9;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sidebar ul li a:hover {

    }

    .sidebar ul li ul {
      padding-left: 20px;
    }

    .sidebar ul li ul li a {

      font-weight: normal;
    }

    .main-content {
      margin-left: 270px;
      padding: 20px;
      flex-grow: 1;
      width: 100%;
      max-width: calc(100% - 270px);
      overflow-x: hidden;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .posts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .posts-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1400px) {
      .posts-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .post-item {
      display: flex;
      flex-direction: column;
      background-color: #BDE8CA;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      min-width: 0;
    }

    .post-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 0;
      margin: 0;
    }

    .post-item .content {
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .post-item h2 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      color: #56806A;
    }

    .post-item p {
      font-size: 1rem;
      color: #555;
      margin: 0 0 10px;
    }

    .post-item a {
      color: #0D7C66;
      text-decoration: none;
      font-weight: bold;
      align-self: flex-start;
    }

    .post-item a:hover {
      text-decoration: underline;
    }

  <script>
    function filterPosts(topic) {
      const posts = document.querySelectorAll('.post-item');
      posts.forEach(post => {
        const topics = post.getAttribute('data-topics').split(',');
        if (topics.includes(topic)) {
          post.style.display = 'flex';
        } else {
          post.style.display = 'none';
        }
      });
    }

    function showAllPosts() {
      const posts = document.querySelectorAll('.post-item');
      posts.forEach(post => {
        post.style.display = 'flex';
      });
    }

    // Initialize by showing all posts
    document.addEventListener('DOMContentLoaded', showAllPosts);
  </script>
